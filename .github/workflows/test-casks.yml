name: Test Casks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub's macOS runners ship with Homebrew preinstalled, so the install
      # below is only a fallback in case that ever stops being true. Guarding on
      # `command -v brew` keeps it a no-op in the normal case; dropping the old
      # `|| true` means a fallback install that genuinely fails now fails here,
      # instead of surfacing as a cryptic error in a later `brew` step. The
      # trailing `brew --version` proves the runner has a working brew before
      # anything else depends on it.
      - name: Ensure Homebrew is available
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            # Download and run as two steps: inlining the curl in a command
            # substitution would mask a download failure and then run an empty
            # script, which "succeeds" while installing nothing.
            curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh -o /tmp/install-homebrew.sh
            /bin/bash /tmp/install-homebrew.sh
          fi
          brew --version

      # Homebrew now refuses to load formulae/casks from third-party taps until
      # the tap is explicitly trusted, so tap + trust must both happen before
      # anything tries to evaluate a cask in this repo.
      - name: Tap and trust this repo
        run: |
          brew tap smartwatermelon/tap .
          brew trust --tap smartwatermelon/tap

      # `brew cask audit` was removed years ago (the flag form replaced it), and
      # `brew audit <path.rb>` is now disabled in favour of passing names. Auditing
      # by tap covers every cask here without enumerating filenames. No `|| true`:
      # a failing audit must fail the build, otherwise this step audits nothing.
      - name: Validate cask syntax
        run: |
          brew audit --tap smartwatermelon/tap --strict

      - name: Test cask installation (dry run)
        run: |
          # Don't actually install, just test that the cask can be parsed
          brew info --cask smartwatermelon/tap/progress-indicator
